plugins {
    id 'com.android.application'
}

android {
    namespace = 'com.landenlabs.widtime'
    compileSdk = 37

    defaultConfig {
        applicationId = "com.landenlabs.widtime"
        minSdk = 26
        targetSdk = 37
        versionCode = 1
        versionName = "1.0"
    }

    buildTypes {
        release {
            // R8 shrink + obfuscate + optimize. Manifest components (activities, receivers,
            // services) are kept automatically by AAPT-generated rules; anything reflective
            // needs a keep rule in proguard-rules.pro.
            minifyEnabled = true
            shrinkResources = true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    compileOptions {
        sourceCompatibility = JavaVersion.VERSION_11
        targetCompatibility = JavaVersion.VERSION_11
    }
}

// Output named with the app version, e.g. WidTime-1.0-debug.apk / WidTime-1.0-release.aab
base {
    archivesName = "WidTime-${android.defaultConfig.versionName}"
}

dependencies {
    implementation 'androidx.appcompat:appcompat:1.7.0'
    implementation 'com.google.android.material:material:1.12.0'
    implementation 'androidx.recyclerview:recyclerview:1.3.2'

    testImplementation 'junit:junit:4.13.2'
}
