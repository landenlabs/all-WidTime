plugins {
    id 'com.android.application'
}

android {
    namespace = 'com.landenlabs.widtime'
    compileSdk = 37

    defaultConfig {
        applicationId = "com.landenlabs.widtime"
        minSdk = 26
        targetSdk = 37
        versionCode = 61125
        versionName = "6.11.25"
    }

    // Release signing is opt-in so a plain `assembleRelease` still works (unsigned)
    // without a keystore. Each value comes from an environment variable (CI sets these
    // from repo secrets, see .github/workflows/release.yml) or, failing that, from the
    // gitignored local.properties:
    //   release.storeFile=../../keystore/all-widtme.jks   (relative to app/)
    //   release.storePassword=...
    //   release.keyAlias=widtime
    //   release.keyPassword=...                           (PKCS12: same as storePassword)
    def localProps = new Properties()
    def localPropsFile = rootProject.file('local.properties')
    if (localPropsFile.exists()) {
        localPropsFile.withInputStream { localProps.load(it) }
    }
    def signingValue = { String envName, String propName ->
        System.getenv(envName) ?: localProps.getProperty(propName)
    }
    def releaseStoreFile = signingValue('CI_KEYSTORE_PATH', 'release.storeFile')

    signingConfigs {
        release {
            if (releaseStoreFile) {
                storeFile file(releaseStoreFile)
                storePassword signingValue('CI_KEYSTORE_PASSWORD', 'release.storePassword')
                keyAlias signingValue('CI_KEY_ALIAS', 'release.keyAlias')
                keyPassword signingValue('CI_KEY_PASSWORD', 'release.keyPassword')
            }
        }
    }

    buildTypes {
        release {
            if (releaseStoreFile) {
                signingConfig = signingConfigs.release
            }
            // R8 shrink + obfuscate + optimize. Manifest components (activities, receivers,
            // services) are kept automatically by AAPT-generated rules; anything reflective
            // needs a keep rule in proguard-rules.pro.
            minifyEnabled = true
            shrinkResources = true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    compileOptions {
        sourceCompatibility = JavaVersion.VERSION_11
        targetCompatibility = JavaVersion.VERSION_11
    }
}

// Output named with the app version, e.g. WidTime-1.0-debug.apk / WidTime-1.0-release.aab
base {
    archivesName = "WidTime-${android.defaultConfig.versionName}"
}

dependencies {
    implementation 'androidx.appcompat:appcompat:1.7.0'
    implementation 'com.google.android.material:material:1.12.0'
    implementation 'androidx.recyclerview:recyclerview:1.3.2'
    // Google Play in-app updates (offered when widget settings open).
    implementation 'com.google.android.play:app-update:2.1.0'
    // Wearable Data Layer: battery readings from the WidTime watch app (module :wear).
    implementation 'com.google.android.gms:play-services-wearable:20.0.1'

    testImplementation 'junit:junit:4.13.2'
    // Android's org.json is a stub in local unit tests; use the real one for geocoder parsing tests.
    testImplementation 'org.json:json:20240303'
}
